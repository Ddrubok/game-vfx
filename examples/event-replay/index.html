<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Event lifetime replay</title>
<style>
body { font: 16px/1.5 system-ui; max-width: 760px; margin: 24px auto; padding: 0 16px; }
canvas { width: 100%; max-width: 512px; background: #15212c; display: block; }
button { margin: 8px 8px 8px 0; padding: 10px; font: inherit; }
output { display: block; } iframe { display: none; }
</style>
<nav aria-label="Language"><a href="?lang=en" lang="en">English</a> · <a href="?lang=ko" lang="ko">한국어</a></nav>
<h1>Event lifetime replay</h1>
<p>Local synthetic input. A small dashed ring is pending; a solid diamond and impact are confirmed. A correction moves a live cue without restarting it. A finished cue stays finished.</p>
<canvas id="scene" width="512" height="512" aria-label="Event effect"></canvas>
<button id="replay">Replay pending → confirmed → correction</button>
<button id="late">Late correction</button><button id="round">Next round</button>
<button id="dispose">Dispose owner</button>
<output id="status" aria-live="polite"></output>
<iframe id="renderer" src="../../assets/canvas-impact.html" title="Shared effect renderer"></iframe>
<script type="module">
import { ImpactEvents } from '../../assets/event-impact.mjs';
const korean = new URLSearchParams(location.search).get('lang') === 'ko';
document.documentElement.lang = korean ? 'ko' : 'en';
document.querySelector(`nav a[lang="${document.documentElement.lang}"]`).setAttribute('aria-current', 'page');
if (korean) {
  document.title = document.querySelector('h1').textContent = '이벤트 수명 재생';
  document.querySelector('p').textContent = '로컬 합성 입력입니다. 작은 점선 고리는 처리 중, 실선 마름모와 충격파는 확정을 뜻합니다. 정정은 재시작 없이 실행 중인 효과를 이동하며, 종료한 효과는 다시 나타나지 않습니다.';
  for (const [id, label] of Object.entries({ replay: '처리 중 → 확정 → 정정 재생', late: '늦은 정정', round: '다음 라운드', dispose: '소유자 폐기' })) document.getElementById(id).textContent = label;
  document.querySelector('nav').setAttribute('aria-label', '언어');
  document.querySelector('#scene').setAttribute('aria-label', '이벤트 효과');
  document.querySelector('#renderer').title = '공유 효과 렌더러';
}
const iframe = document.querySelector('#renderer');
if (!iframe.contentWindow.vfx) await new Promise(resolve => iframe.addEventListener('load', resolve, { once: true }));
const vfx = iframe.contentWindow.vfx, canvas = document.querySelector('#scene'), ctx = canvas.getContext('2d');
let owner = new ImpactEvents(), generation = 1, raf = 0;
const send = (changes = {}) => owner.receive({ id: 'hit', round: owner.round,
  revision: 1, state: 'pending', point: { x: 256, y: 256 }, ...changes });
function render() {
  ctx.clearRect(0, 0, 512, 512);
  for (const cue of owner.snapshot()) {
    if (cue.kind === 'impact') {
    const image = vfx.frameAt(cue.age, { color: '#29b8ad', seed: 23,
      reducedMotion: matchMedia('(prefers-reduced-motion: reduce)').matches });
    ctx.drawImage(image, cue.point.x - 256, cue.point.y - 256);
    }
    ctx.save(); ctx.translate(cue.point.x, cue.point.y); ctx.lineWidth = 3;
    ctx.strokeStyle = cue.kind === 'preview' ? '#d89032' : '#29b8ad';
    ctx.beginPath();
    if (cue.kind === 'preview') {
      ctx.setLineDash([4, 4]); ctx.arc(0, 0, 12, 0, Math.PI * 2);
    } else {
      ctx.moveTo(0, -22); ctx.lineTo(22, 0); ctx.lineTo(0, 22); ctx.lineTo(-22, 0); ctx.closePath();
    }
    ctx.stroke(); ctx.restore();
  }
  const pending = owner.snapshot().filter(c => c.kind === 'preview').length, confirmed = owner.snapshot().filter(c => c.kind === 'impact').length;
  document.querySelector('#status').textContent = korean
    ? `${owner.round}; 처리 중 ${pending}; 확정 ${confirmed}; 생성 ${owner.bursts}; 소유자 ${owner.closed ? '폐기됨' : '활성'}`
    : `${owner.round}; pending ${pending}; confirmed ${confirmed}; bursts ${owner.bursts}; owner ${owner.closed ? 'disposed' : 'live'}`;
}
function stop() { cancelAnimationFrame(raf); raf = 0; }
function reset() { stop(); owner.dispose(); owner = new ImpactEvents({ round: `round-${++generation}` }); render(); }
function replay() {
  reset(); send(); let last = performance.now(), confirmed = false, corrected = false;
  function tick(now) {
    owner.advance((now - last) / 1000); last = now;
    if (owner.clock >= .15 && !confirmed) { send({ revision: 2, state: 'confirmed' }); confirmed = true; }
    if (owner.clock >= .4 && !corrected) { send({ revision: 3, state: 'confirmed', point: { x: 290, y: 256 } }); corrected = true; }
    render(); if (owner.clock < .8) raf = requestAnimationFrame(tick);
  }
  raf = requestAnimationFrame(tick);
}
document.querySelector('#replay').onclick = replay;
document.querySelector('#late').onclick = () => { send({ revision: 99, state: 'confirmed' }); render(); };
document.querySelector('#round').onclick = () => { stop(); owner.nextRound(`round-${++generation}`); render(); };
document.querySelector('#dispose').onclick = () => { stop(); owner.dispose(); render(); };
window.addEventListener('pagehide', () => { stop(); owner.dispose(); });
window.demo = { reset, send, render, step: seconds => { owner.advance(seconds); render(); }, get owner() { return owner; } };
render();
</script>
</html>
